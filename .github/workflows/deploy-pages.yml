name: Deploy to GitHub Pages

# Builds the site as a static export and publishes it to GitHub Pages
# on every push to the default branch (plus manual runs from the Actions tab).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and mint an identity token for the deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it mid-publish,
# but only keep one queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Static export: prerenders the routes to real HTML so GitHub Pages can serve them.
      # GITHUB_PAGES turns on prerendering and disables the server bundle in vite.config.ts.
      # VITE_BASE_PATH makes asset URLs resolve under the repository sub-path.
      - name: Determine base path
        id: base
        # The repository name (used as the Pages sub-path) is absent from the
        # event payload on manual runs, so derive it from the repository slug.
        run: echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          # Asset URLs must resolve under the repository sub-path, e.g. /my-repo/.
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      # GitHub Pages ignores directories starting with an underscore by default,
      # so drop a .nojekyll marker to be safe.
      - name: Add .nojekyll
        run: touch dist/client/.nojekyll

      # SPA fallback: Pages serves 404.html for unknown paths, which also makes
      # deep links work if you later add client-side routes.
      - name: Add 404 fallback
        run: cp dist/client/index.html dist/client/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site if it does not exist yet, so the first run on a
          # fresh repository works without manually toggling Settings -> Pages.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
